name: Continuous Integration

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  # Cancel previous runs that are not completed yet
  group: credo-controller-${{ github.ref }}-${{ github.repository }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    name: Validate
    steps:
      - name: Checkout credo-controller
        uses: actions/checkout@v4

      - name: Setup node v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      # The route guard in src/__tests__/routeSecurity.spec.ts reads the generated routes, and
      # `yarn compile` regenerates them at build time. Without this the guard would check a stale
      # artifact and a controller missing @Security could pass CI and still deploy unguarded.
      - name: Generate routes
        run: yarn tsoa

      - name: Verify generated routes are committed
        run: git diff --exit-code src/routes/

      - name: Linting
        run: yarn lint

      - name: Prettier
        run: yarn check-format

      - name: Compile
        run: yarn check-types

      - name: Compile tests
        run: yarn check-types:test

      - name: Test
        run: yarn test
